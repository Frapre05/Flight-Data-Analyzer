name: Raccogli dati OpenSky

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  raccogli:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa le librerie necessarie
        run: pip install -r requirements.txt

      - name: Esegui lo script di raccolta
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: python raccogli_dati.py

      - name: Salva i nuovi dati nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add storico_voli.csv
          git commit -m "Aggiornamento automatico dati" || echo "Nessuna modifica da salvare"
          git push
          # Tentativo di resuscitare
